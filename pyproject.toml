[project]
name = "agent-airlock"
version = "0.1.0"
description = "A provenance and authority layer for autonomous AI agents."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
